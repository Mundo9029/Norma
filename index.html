<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captura de Productos</title>
<style>
  /* ... (tus estilos anteriores se mantienen igual) ... */
</style>
</head>
<body>

  <h1>📸 Mis Productos</h1>
  <button class="btn-menu" onclick="abrirCamara()">📷 Tomar foto a producto</button>
  <button class="btn-menu" onclick="window.location.href='productos.html'">📋 Ver productos</button>

  <!-- Modal de cámara (igual que antes) -->
  <div class="overlay" id="overlay">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="fotoAnime" class="anime-img" style="display:none;">

    <div class="modal-controls" id="controlesCaptura">
      <button class="btn-tomar" onclick="tomarFoto()">📸 Tomar foto</button>
      <button class="btn-cancelar" onclick="cerrarCamara()">✖ Cancelar</button>
    </div>

    <div class="form-captura" id="formulario">
      <label>Nombre del producto:</label>
      <input type="text" id="nombreProd" placeholder="Ej: Camiseta">
      <label>Precio:</label>
      <input type="number" id="precioProd" placeholder="Ej: 15000" min="0">
      <div class="modal-controls">
        <button class="btn-aceptar" onclick="aceptarProducto()">✅ Aceptar</button>
        <button class="btn-cancelar" onclick="cerrarCamara()">✖ Cancelar</button>
      </div>
    </div>
  </div>

<script>
  let stream = null;
  let fotoDataURL = "";

  // --- CONFIGURACIÓN: Pon aquí la URL de tu Worker de Cloudflare ---
  const WORKER_URL = "https://tu-worker.tu-usuario.workers.dev";

  const overlay = document.getElementById('overlay');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const fotoAnime = document.getElementById('fotoAnime');
  const formulario = document.getElementById('formulario');
  const controlesCaptura = document.getElementById('controlesCaptura');

  async function abrirCamara() {
    // ... (esta función no cambia, sigue igual que antes) ...
    overlay.classList.add('active');
    formulario.classList.remove('active');
    controlesCaptura.style.display = 'flex';
    video.style.display = 'block';
    fotoAnime.style.display = 'none';

    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
    } catch (err) {
      alert("No se pudo acceder a la cámara: " + err.message);
      cerrarCamara();
    }
  }

  function tomarFoto() {
    // ... (esta función no cambia) ...
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    fotoDataURL = canvas.toDataURL('image/jpeg', 0.8);
    fotoAnime.src = fotoDataURL;
    fotoAnime.style.display = 'block';
    video.style.display = 'none';
    controlesCaptura.style.display = 'none';
    formulario.classList.add('active');
  }

  // --- ÚNICA FUNCIÓN QUE CAMBIA ---
  async function aceptarProducto() {
    const nombre = document.getElementById('nombreProd').value.trim();
    const precio = document.getElementById('precioProd').value.trim();

    if (!nombre || !precio) {
      alert("Por favor completa el nombre y el precio.");
      return;
    }

    // 1. Convertir la foto a un archivo (Blob)
    const blob = await (await fetch(fotoDataURL)).blob();
    const formData = new FormData();
    formData.append('imagen', blob, 'foto.jpg');
    formData.append('nombre', nombre);
    formData.append('precio', precio);

    try {
      // 2. Enviar la foto y los datos al Worker
      const res = await fetch(WORKER_URL + '/subir', {
        method: 'POST',
        body: formData
      });

      if (!res.ok) throw new Error('Error al subir la imagen');

      const data = await res.json();
      // El Worker nos devuelve la URL de la imagen subida
      const imageUrl = data.url;

      // 3. Guardar SOLO la URL en localStorage (ligero)
      const productos = JSON.parse(localStorage.getItem('productos') || '[]');
      productos.push({
        id: Date.now(),
        imagen: imageUrl, // 👈 ahora es un enlace, no la imagen pesada
        nombre: nombre,
        precio: parseFloat(precio)
      });
      localStorage.setItem('productos', JSON.stringify(productos));

      // 4. Limpiar y cerrar
      document.getElementById('nombreProd').value = '';
      document.getElementById('precioProd').value = '';
      cerrarCamara();
      alert("✅ Producto guardado correctamente");
    } catch (error) {
      console.error(error);
      alert("❌ No se pudo guardar el producto. Revisa la consola.");
    }
  }

  function cerrarCamara() {
    // ... (esta función no cambia) ...
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    overlay.classList.remove('active');
    formulario.classList.remove('active');
    fotoAnime.style.display = 'none';
    video.style.display = 'block';
  }
</script>
</body>
</html>
